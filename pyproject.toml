[project]
name = "dead-channel"
version = "0.1.0"
authors = [
    { name = "doubletap-dave", email = "25110228+doubletap-dave@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.32.1",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dead-channel = "dead_channel.cli.app:main"
dead-channel-dev = "dead_channel.cli.dev:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
